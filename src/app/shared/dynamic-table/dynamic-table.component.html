<div class="dynamic-table-container mat-elevation-z8">

  <table mat-table [dataSource]="dataSource" matSort (matSortChange)="sortChange.emit($event)">

    <!-- Columnas generadas dinámicamente -->
    <ng-container *ngFor="let col of gridConfig.columns" [matColumnDef]="col.id">
      <th mat-header-cell *matHeaderCellDef mat-sort-header [disabled]="!col.sortable"> {{col.title}} </th>
      <td mat-cell *matCellDef="let row">
        <div [ngSwitch]="col.format">
          <span *ngSwitchCase="'date'">{{ row[col.id] | date: 'mediumDate' }}</span>
          <span *ngSwitchCase="'currency'">{{ row[col.id] | currency: 'USD' }}</span>
          <span *ngSwitchDefault>{{ row[col.id] }}</span>
        </div>
      </td>
    </ng-container>

    <!-- Columna de Acciones -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> Acciones </th>
      <td mat-cell *matCellDef="let row">
        <button mat-icon-button color="primary" (click)="onActionClick('edit', row)" matTooltip="Editar">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="onActionClick('delete', row)" matTooltip="Eliminar">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

    <!-- PAGINADOR -->
  <mat-paginator
    *ngIf="gridConfig.options?.pagination"
    [length]="gridConfig.options.pagination.totalItems"
    [pageSize]="gridConfig.options.pagination.pageSize"
    [pageSizeOptions]="gridConfig.options.pagination.pageSizeOptions"
    (page)="pageChange.emit($event)"
    showFirstLastButtons>
  </mat-paginator>

</div>
