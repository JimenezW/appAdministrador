<div fxFlex="95%">
  <div class="container">
    <h2>{{ !isEdit ? 'Crear' : 'Editar'}} roles</h2>
  </div>

  <div class="container">
    <div class="row">
      <button mat-icon-button color="warn" aria-label="atras" (click)="clickRegresar()">
          <mat-icon>arrow_back</mat-icon>
      </button>
    </div>

    <mat-card>
      <mat-card-header>
        <mat-card-title>Shiba Inu</mat-card-title>
      </mat-card-header>

      <mat-card-content>
        <p>
          The Shiba Inu is the smallest of the six original and distinct spitz breeds of dog from Japan.
          A small, agile dog that copes very well with mountainous terrain, the Shiba Inu was originally
          bred for hunting.
        </p>
      </mat-card-content>
      <mat-card-actions>
        <button mat-button color="primary">Guardar</button>
        <button mat-button color="warn">Cancelar</button>
      </mat-card-actions>
    </mat-card>



  </div>
</div>
