<div fxFlex="95%">
  <div class="container">
    <h2>{{ !isEdit ? 'Crear' : 'Editar'}} roles</h2>
  </div>

  <div class="container">
    <div class="row">
      <button mat-icon-button color="warn" aria-label="atras" (click)="clickRegresar()">
          <mat-icon>arrow_back</mat-icon>
      </button>
    </div>

    <mat-card>
      <mat-card-content>
        <form [formGroup]="form">
          <div class="row">
            <div class="col " >
              <mat-form-field class="full-width">
                <mat-label>Nombre</mat-label>
                <input matInput formControlName="nombre">
                <mat-error *ngIf="form.get('nombre')?.hasError('required') && form.get('nombre')?.touched">
                  La descripción es requerida
                </mat-error>
              </mat-form-field>
            </div>
            <div class="col">
              <mat-form-field class="full-width">
                <mat-label>Nombre corto</mat-label>
                <input matInput formControlName="nombreCorto">
                <mat-error *ngIf="form.get('nombreCorto')?.hasError('required') && form.get('nombreCorto')?.touched">
                  La descripción es requerida
                </mat-error>
              </mat-form-field>
            </div>
            <div class="col">
              <mat-form-field class="full-width">
                <mat-label>Descripcion</mat-label>
                <input matInput formControlName="descripcion">
                <mat-error *ngIf="form.get('descripcion')?.hasError('required') && form.get('descripcion')?.touched">
                  La descripción es requerida
                </mat-error>
                <mat-error *ngIf="form.get('descripcion')?.hasError('minlength') && form.get('descripcion')?.touched">
                  La descripción debe tener al menos 8 caracteres
                </mat-error>
              </mat-form-field>
            </div>
          </div>
        </form>

      </mat-card-content>
      <mat-card-actions>
        <button mat-button color="primary" (click)="clickCrear()">Guardar</button>
        <button mat-button color="warn" (click)="clickCerrar()">Cancelar</button>
      </mat-card-actions>
    </mat-card>



  </div>
</div>
